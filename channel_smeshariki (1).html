  .channel-btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; transition: .15s; }
  .channel-btn:hover { border-color: var(--accent); }

  .channel-num { font-size: 11px; opacity: 0.7; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 6px; }

  .live-clock .date { color: var(--muted); font-size: 12px; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(57,231,95,.1); border: 1px solid rgba(57,231,95,.4); color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px; border-radius: 999px; }

  .screen { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16/9; width: 100%; }
  
  .screen-guard { position: absolute; inset: 0; z-index: 5; pointer-events: auto; }
  .video-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .video-container iframe { width: 100%; height: 100%; border: 0; }

const TOTAL = SCHED.reduce((a,s)=>a+parseDuration(s.duration),0);
const T0 = Date.UTC(2026,0,1);

function parseDuration(v) {
  if (typeof v === 'number') return v;
  if (!v) return 0;
  const p = String(v).split(':').map(Number);
  return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : Number(v)||0;
}

function scheduleState(now) {
  let t = ((now - T0)/1000) % TOTAL;
  if (t < 0) t += TOTAL;
  for (let i=0;i<SCHED.length;i++) {
    const d = parseDuration(SCHED[i].duration);
    if (t < d) return { idx:i, offset:Math.floor(t), remain:Math.floor(d-t) };
    t -= d;
  }
  return { idx:0, offset:0, remain:0 };
}

let player = null, playerIdx = -1;

function startTV() {
  document.getElementById('unmute-overlay').style.display = 'none';
  document.getElementById('screen-guard').style.pointerEvents = 'none';
  if (player) return;
  const st = scheduleState(Date.now());
  playerIdx = st.idx;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: SCHED[st.idx].id,
      playerVars: {
        autoplay: 1, mute: 1, controls: 0, start: st.offset,
        playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, iv_load_policy: 3
      }
    });
    syncLoop();
  };
}

function syncLoop() {
  setInterval(() => {
    if (!player || !player.loadVideoById) return;
    const st = scheduleState(Date.now());
    if (st.idx !== playerIdx) {
      playerIdx = st.idx;
      player.loadVideoById({ videoId: SCHED[st.idx].id, startSeconds: st.offset });
    }
  }, 2000);
}

let muted = true;
function toggleMute() {
  if (!player || !player.unMute) return;
  muted = !muted;
  muted ? player.mute() : player.unMute();
  document.getElementById('mute-btn').textContent = muted ? '🔇 Звук' : '🔊 Выключить звук';
}

function updateUI() {
  const now = Date.now();
  const st = scheduleState(now);
  const ep = SCHED[st.idx];
  const d = parseDuration(ep.duration);
  document.getElementById('now-title').textContent = ep.title;
  document.getElementById('prog').style.width = (st.offset/d*100).toFixed(2) + '%';
  const f = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
  document.getElementById('elapsed').textContent = f(st.offset);
  document.getElementById('remain').textContent = 'осталось ' + f(st.remain);
  let html_ = '';
  for (let k=1;k<=5;k++) {
    const e2 = SCHED[(st.idx+k)%SCHED.length];
    const when = new Date(now + (st.remain + SCHED.slice(st.idx+1, st.idx+k).reduce((a,s)=>a+parseDuration(s.duration),0))*1000);
    const t = e2.title.replace(/</g,'&lt;');
    html_ += '<div class="next-item"><span>' + t + '</span><span class="when">' +
      String(when.getHours()).padStart(2,'0') + ':' + String(when.getMinutes()).padStart(2,'0') + '</span></div>';
  }
  document.getElementById('next-list').innerHTML = html_;
  document.getElementById('clock').textContent = new Date(now).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent = new Date(now).toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'});
  if (playerIdx >= 0) document.getElementById('watermark-logo-img').classList.add('visible');
}
